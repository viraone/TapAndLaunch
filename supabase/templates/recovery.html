<!-- Supabase "Reset password" email for TapAndLaunch. Locally it is loaded by supabase/config.toml; in production the
     same subject and HTML are set in Supabase > Authentication > Emails > Reset password. The link uses the token hash
     (not the code exchange) so it works on any device; /auth/confirm verifies it. -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#171717">
  <p style="font-size:18px;font-weight:600;margin:0 0 16px">TapAndLaunch</p>
  <h1 style="font-size:22px;margin:0 0 12px">Reset your password</h1>
  <p style="font-size:15px;line-height:1.5;margin:0 0 24px">Someone asked to reset the password for this TapAndLaunch account. Click the button to choose a new one.</p>
  <p style="margin:0 0 24px">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
       style="display:inline-block;background:#4F46E5;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:999px">Choose a new password</a>
  </p>
  <p style="font-size:13px;line-height:1.5;color:#525252;margin:0 0 8px">The link works once and expires in one hour.</p>
  <p style="font-size:13px;line-height:1.5;color:#525252;margin:0">If you didn't ask for this, you can ignore this email. Your password stays the same.</p>
</div>
